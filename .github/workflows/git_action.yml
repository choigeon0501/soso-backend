name: CI CD

on:
  push:
    branches: ['dev']
  pull_request:
    branches: ['dev']

env:
  LIGHTSAIL_SSH_KEY: ${{ secrets.LIGHTSAIL_SSH_KEY }}
  LIGHTSAIL_HOST: ${{ secrets.LIGHTSAIL_HOST }}
  LIGHTSAIL_USERNAME: bitnami
  AWS_REGION: ap-northeast-2

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: 소스 코드 체크아웃
        uses: actions/checkout@v3

      - name: SSH 키 설정
        run: |
          mkdir -p $HOME/.ssh
          echo "${{ secrets.LIGHTSAIL_SSH_KEY }}" > $HOME/.ssh/deploy_key
          chmod 600 $HOME/.ssh/deploy_key
          eval $(ssh-agent -s)
          ssh-add $HOME/.ssh/deploy_key
          ssh-keyscan -H ${{ secrets.LIGHTSAIL_HOST }} >> $HOME/.ssh/known_hosts

      - name: 원격 서버에서 git pull 및 재시작
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.LIGHTSAIL_HOST }}
          username: ${{ env.LIGHTSAIL_USERNAME }}
          key: ${{ secrets.LIGHTSAIL_SSH_KEY }}
          script: |
            cd /home/bitnami/soso-backend

            echo "🚀 Git Pull 시작"
            git remote set-url origin https://${{ github.actor }}:${{ env.ACCESS_TOKEN_GITHUB }}@github.com/${{ github.repository }}.git
            git pull origin dev

            echo "📦 패키지 설치"
            sudo npm i

            echo "🔨 빌드 중..."
            sudo npm run build

            echo "♻️ PM2 재시작"
            sudo pm2 restart main